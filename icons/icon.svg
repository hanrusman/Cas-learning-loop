<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3a"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff"/>
      <stop offset="100%" style="stop-color:#00e5ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Grid dots (beat sequencer) -->
  <g opacity="0.3">
    <circle cx="120" cy="360" r="12" fill="#7c4dff"/>
    <circle cx="170" cy="360" r="12" fill="#7c4dff"/>
    <circle cx="220" cy="360" r="12" fill="#1a1a3a" stroke="#7c4dff" stroke-width="2"/>
    <circle cx="270" cy="360" r="12" fill="#7c4dff"/>
    <circle cx="320" cy="360" r="12" fill="#1a1a3a" stroke="#7c4dff" stroke-width="2"/>
    <circle cx="370" cy="360" r="12" fill="#7c4dff"/>
    <circle cx="120" cy="400" r="12" fill="#1a1a3a" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="170" cy="400" r="12" fill="#00e5ff"/>
    <circle cx="220" cy="400" r="12" fill="#1a1a3a" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="270" cy="400" r="12" fill="#1a1a3a" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="320" cy="400" r="12" fill="#00e5ff"/>
    <circle cx="370" cy="400" r="12" fill="#1a1a3a" stroke="#00e5ff" stroke-width="2"/>
  </g>
  <!-- Music note symbol -->
  <g transform="translate(256,180)">
    <!-- Note head 1 -->
    <ellipse cx="-40" cy="60" rx="32" ry="24" fill="url(#accent)" transform="rotate(-20,-40,60)"/>
    <!-- Note head 2 -->
    <ellipse cx="50" cy="40" rx="32" ry="24" fill="url(#accent)" transform="rotate(-20,50,40)"/>
    <!-- Stems -->
    <rect x="-12" y="-80" width="6" height="140" fill="url(#accent)" rx="3"/>
    <rect x="78" y="-100" width="6" height="140" fill="url(#accent)" rx="3"/>
    <!-- Beam -->
    <rect x="-12" y="-100" width="96" height="8" fill="url(#accent)" rx="4" transform="rotate(-8,-12,-100)"/>
    <rect x="-12" y="-82" width="96" height="8" fill="url(#accent)" rx="4" transform="rotate(-8,-12,-82)"/>
  </g>
  <!-- "LoopLab" text -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="white" opacity="0.9">LoopLab</text>
</svg>
