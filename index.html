<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopLab - Maak je eigen beats!</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sequencer.css">
    <link rel="stylesheet" href="css/piano-roll.css">
    <link rel="stylesheet" href="css/practice.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="main-header">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <h1>LoopLab</h1>
            </div>
            <nav id="main-nav">
                <button class="nav-btn active" data-view="sequencer">
                    <span class="nav-icon">🥁</span>
                    <span>Beat Maker</span>
                </button>
                <button class="nav-btn" data-view="piano">
                    <span class="nav-icon">🎹</span>
                    <span>Melodie</span>
                </button>
                <button class="nav-btn" data-view="practice">
                    <span class="nav-icon">🎸</span>
                    <span>Oefenen</span>
                </button>
                <button class="nav-btn" data-view="songs">
                    <span class="nav-icon">💾</span>
                    <span>Mijn Songs</span>
                </button>
            </nav>
        </header>

        <!-- Transport Controls -->
        <div id="transport">
            <div class="transport-left">
                <button id="btn-play" class="transport-btn" title="Afspelen">▶</button>
                <button id="btn-stop" class="transport-btn" title="Stoppen">⏹</button>
                <button id="btn-record" class="transport-btn" title="Opnemen">⏺</button>
            </div>
            <div class="transport-center">
                <div class="bpm-control">
                    <button id="bpm-down" class="bpm-btn">−</button>
                    <div class="bpm-display">
                        <span id="bpm-value">120</span>
                        <span class="bpm-label">BPM</span>
                    </div>
                    <button id="bpm-up" class="bpm-btn">+</button>
                </div>
                <div class="time-signature">
                    <select id="time-sig">
                        <option value="4">4/4</option>
                        <option value="3">3/4</option>
                        <option value="6">6/8</option>
                    </select>
                </div>
                <div class="swing-control">
                    <label>Swing</label>
                    <input type="range" id="swing" min="0" max="100" value="0">
                </div>
            </div>
            <div class="transport-right">
                <div class="master-volume">
                    <span>🔊</span>
                    <input type="range" id="master-volume" min="0" max="100" value="80">
                </div>
            </div>
        </div>

        <!-- Step indicator -->
        <div id="step-indicator">
            <div class="step-dots"></div>
        </div>

        <!-- Views -->
        <main id="main-content">
            <!-- Beat Sequencer View -->
            <section id="view-sequencer" class="view active">
                <div class="sequencer-toolbar">
                    <div class="pattern-selector">
                        <label>Patroon:</label>
                        <div class="pattern-buttons">
                            <button class="pattern-btn active" data-pattern="0">A</button>
                            <button class="pattern-btn" data-pattern="1">B</button>
                            <button class="pattern-btn" data-pattern="2">C</button>
                            <button class="pattern-btn" data-pattern="3">D</button>
                        </div>
                    </div>
                    <div class="sequencer-actions">
                        <button id="btn-clear-pattern" class="action-btn">🗑 Wissen</button>
                        <button id="btn-random-pattern" class="action-btn">🎲 Random</button>
                        <button id="btn-copy-pattern" class="action-btn">📋 Kopieer</button>
                    </div>
                </div>
                <div id="beat-grid" class="beat-grid">
                    <!-- Generated by JS -->
                </div>
                <div class="kit-selector">
                    <label>Drum Kit:</label>
                    <select id="drum-kit-select">
                        <option value="electronic">Electronic</option>
                        <option value="hiphop">Hip Hop</option>
                        <option value="rock">Rock</option>
                        <option value="latin">Latin</option>
                    </select>
                </div>
            </section>

            <!-- Piano Roll View -->
            <section id="view-piano" class="view">
                <div class="piano-toolbar">
                    <div class="instrument-selector">
                        <label>Instrument:</label>
                        <select id="melody-instrument">
                            <option value="synth">Synth Lead</option>
                            <option value="piano">Piano</option>
                            <option value="bass">Bass</option>
                            <option value="strings">Strings</option>
                            <option value="pluck">Pluck</option>
                        </select>
                    </div>
                    <div class="scale-selector">
                        <label>Toonladder:</label>
                        <select id="scale-select">
                            <option value="chromatic">Chromatisch</option>
                            <option value="major">Majeur</option>
                            <option value="minor">Mineur</option>
                            <option value="pentatonic">Pentatonisch</option>
                            <option value="blues">Blues</option>
                        </select>
                        <select id="key-select">
                            <option value="C">C</option>
                            <option value="C#">C#</option>
                            <option value="D">D</option>
                            <option value="D#">D#</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                            <option value="F#">F#</option>
                            <option value="G">G</option>
                            <option value="G#">G#</option>
                            <option value="A">A</option>
                            <option value="A#">A#</option>
                            <option value="B">B</option>
                        </select>
                    </div>
                    <div class="piano-actions">
                        <button id="btn-clear-melody" class="action-btn">🗑 Wissen</button>
                        <button id="btn-random-melody" class="action-btn">🎲 Random</button>
                    </div>
                </div>
                <div id="piano-roll-container">
                    <div id="piano-keys">
                        <!-- Generated by JS -->
                    </div>
                    <div id="piano-grid">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </section>

            <!-- Practice View -->
            <section id="view-practice" class="view">
                <div class="practice-toolbar">
                    <div class="practice-mode-selector">
                        <button class="practice-mode-btn active" data-mode="rhythm">🥁 Ritme</button>
                        <button class="practice-mode-btn" data-mode="melody">🎹 Melodie</button>
                    </div>
                    <div class="difficulty-selector">
                        <label>Moeilijkheid:</label>
                        <select id="difficulty">
                            <option value="easy">Makkelijk</option>
                            <option value="medium">Normaal</option>
                            <option value="hard">Moeilijk</option>
                        </select>
                    </div>
                </div>
                <div id="practice-area">
                    <div id="practice-score">
                        <span class="score-label">Score:</span>
                        <span id="score-value">0</span>
                        <span class="combo-label">Combo:</span>
                        <span id="combo-value">0x</span>
                        <div id="accuracy-meter">
                            <div id="accuracy-fill"></div>
                            <span id="accuracy-text">100%</span>
                        </div>
                    </div>
                    <div id="practice-highway">
                        <div id="hit-zone"></div>
                        <div id="falling-notes"></div>
                    </div>
                    <div id="practice-input">
                        <div id="practice-pads">
                            <!-- Generated by JS -->
                        </div>
                        <p class="practice-hint">Gebruik toetsen 1-4 of klik op de pads!</p>
                    </div>
                    <div class="practice-controls">
                        <button id="btn-start-practice" class="action-btn big">🎮 Start!</button>
                        <button id="btn-stop-practice" class="action-btn big" style="display:none">⏹ Stop</button>
                    </div>
                </div>
                <div id="practice-results" style="display:none">
                    <h2>Resultaat!</h2>
                    <div id="result-stars"></div>
                    <div id="result-stats"></div>
                    <button id="btn-retry" class="action-btn big">🔄 Opnieuw</button>
                </div>
            </section>

            <!-- Songs View -->
            <section id="view-songs" class="view">
                <div class="songs-toolbar">
                    <button id="btn-new-song" class="action-btn">✨ Nieuw</button>
                    <button id="btn-save-song" class="action-btn">💾 Opslaan</button>
                    <button id="btn-export-wav" class="action-btn">🎵 Export WAV</button>
                </div>
                <div id="song-arranger">
                    <h3>Song Arrangement</h3>
                    <div id="arrangement-timeline">
                        <!-- Generated by JS -->
                    </div>
                    <div class="arrangement-controls">
                        <button id="btn-add-section" class="action-btn">+ Sectie</button>
                    </div>
                </div>
                <div id="saved-songs-list">
                    <h3>Opgeslagen Songs</h3>
                    <div id="songs-grid">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/audio-engine.js"></script>
    <script src="js/instruments.js"></script>
    <script src="js/sequencer.js"></script>
    <script src="js/piano-roll.js"></script>
    <script src="js/practice.js"></script>
    <script src="js/songs.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
